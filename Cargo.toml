[package]
name = "orderbook"
version = "0.1.0"
edition = "2024"

[lib]
name = "orderbook"
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = 3
debug = false
strip = true
codegen-units = 1
panic = 'abort'

[profile.bench]
lto = true
opt-level = 3
codegen-units = 1 


[dependencies]
rand = "0.10"
serde = { version = "1.0", features = ["derive"]}
csv = "1.3.0"
thiserror = "2.0"
rstest = "0.26"
readable = "0.16"
log = "0.4.21"
log4rs = "1.3.0"
rayon = "1.10"
clap = { version = "4.6", features = ["derive"] }
clap_derive = { version = "4.0.0-rc.1" }

[dev-dependencies]
criterion = {version = "0.8", features = ["html_reports"]}
pretty_assertions = "1.4"
# hdf5-sys = "0.3.2"
# tempfile
# proptest
# insta
[build]
rustflags = ["-C", "target-cpu=native"]

[[bench]]
name = "order_benchmark"
harness = false

[[test]]
name = "strategy_flow"
test = false
